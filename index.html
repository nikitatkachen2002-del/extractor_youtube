<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATRIX DIAGNOSTIC APP</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['"Share Tech Mono"', 'monospace'] },
                    colors: {
                        matrix: { black: '#000000', green: '#00FF41', light: '#b8ffd0' }
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(0, 255, 65, 0.5), inset 0 0 10px rgba(0, 255, 65, 0.2)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #000; color: #00FF41; font-family: 'Share Tech Mono', monospace; overflow-x: hidden; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
        .terminal-scroll::-webkit-scrollbar { width: 8px; }
        .terminal-scroll::-webkit-scrollbar-track { background: rgba(0, 20, 0, 0.8); border-left: 1px solid #00FF41; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: rgba(0, 255, 65, 0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    
    <canvas id="matrix-canvas"></canvas>

    <main class="w-full max-w-4xl bg-matrix-black/90 backdrop-blur-sm border border-matrix-green shadow-neon p-6 flex flex-col gap-6 relative z-10">
        <header class="border-b border-matrix-green/50 pb-4 text-center sm:text-left">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-widest">
                MATRIX DIAGNOSTIC INTERFACE
            </h1>
            <p class="text-matrix-green/70 text-sm mt-2">SYSTEM.PROTOCOL: CLICK_TEST</p>
        </header>

        <div class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label for="urlInput" class="text-sm font-bold tracking-widest text-matrix-light">> TARGET_URL</label>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="urlInput" 
                        class="block w-full flex-1 px-4 py-3 bg-black border border-matrix-green text-matrix-green focus:outline-none"
                        placeholder="Вставь любую ссылку..." autocomplete="off">
                    
                    <button type="button" id="submitBtn" class="bg-black border border-matrix-green text-matrix-green hover:bg-matrix-green hover:text-black font-bold py-3 px-8 transition-all shadow-neon uppercase tracking-widest cursor-pointer">
                        INITIATE_EXTRACTION
                    </button>
                </div>
            </div>
        </div>

        <section class="flex flex-col border border-matrix-green h-64 bg-black/90 relative">
            <div class="flex items-center justify-between px-4 py-2 border-b border-matrix-green/50 bg-matrix-green/10">
                <h3 class="text-xs font-bold uppercase tracking-widest text-matrix-light">Terminal_Logs</h3>
                <span class="text-xs animate-pulse text-matrix-green">_ONLINE</span>
            </div>
            <div id="terminal" class="flex-1 overflow-y-auto terminal-scroll text-xs sm:text-sm p-4 space-y-1">
                <div class="text-matrix-green/70">> СИСТЕМА ЗАГРУЖЕНА. НАЖМИ КНОПКУ ИНИЦИАЦИИ...</div>
            </div>
        </section>
    </main>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.ready();
            } catch (e) {}
        }

        // Фон Матрицы
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, columns;
        const drops = [];
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()'.split('');

        function initMatrix() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = width / 16;
            drops.length = 0;
            for (let x = 0; x < columns; x++) drops[x] = Math.random() * -100;
            ctx.font = '16px "Share Tech Mono"';
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#0F0';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 16, drops[i] * 16);
                if (drops[i] * 16 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        initMatrix();
        window.addEventListener('resize', initMatrix);
        setInterval(drawMatrix, 33);

        // --- ССЫЛКА НА ТВОЙ CLOUDFLARE WORKER ---
        const BACKEND_URL = "https://icy-shape-e24a.nikita-tkachen2002.workers.dev";

        const submitBtn = document.getElementById('submitBtn');
        const urlInput = document.getElementById('urlInput');
        const terminal = document.getElementById('terminal');

        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
            const line = document.createElement('div');
            if (isError) {
                line.className = 'text-red-500 font-bold';
                line.innerHTML = `[${time}] !! ${message}`;
            } else {
                line.className = 'text-matrix-green';
                line.innerHTML = `[${time}] > ${message}`;
            }
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Проверяем, реагирует ли кнопка на нажатие
        submitBtn.addEventListener('click', async () => {
            const targetUrl = urlInput.value.trim();
            
            addLog("КНОПКА НАЖАТА УСПЕШНО!");

            if (!targetUrl) {
                addLog("ОШИБКА: Поле ввода пустое!", true);
                return;
            }

            addLog(`Целевая ссылка получена: ${targetUrl}`);
            
            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            const chatId = tgUser ? tgUser.id : null;

            if (chatId) {
                addLog(`Найден Telegram Chat ID: ${chatId}`);
            } else {
                addLog("ВНИМАНИЕ: Chat ID не найден (открыто вне Telegram).", true);
            }

            addLog("Отправка запроса на Cloudflare Worker...");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        url: targetUrl,
                        chat_id: chatId 
                    })
                });

                const textResp = await response.text();
                addLog(`Ответ сервера получен. Статус: ${response.status}`);
                addLog(`Текст ответа: ${textResp}`);

                if (response.ok) {
                    addLog("ТЕСТ СВЯЗИ ПРОШЕЛ УСПЕШНО!");
                } else {
                    addLog("Сервер вернул ошибку.", true);
                }

            } catch (err) {
                addLog(`КРИТИЧЕСКАЯ ОШИБКА СЕТИ: ${err.message}`, true);
            }
        });
    </script>
</body>
</html>
